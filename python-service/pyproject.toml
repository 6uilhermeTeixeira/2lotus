[project]
name = "2lotus-service"
version = "0.1.0"
dependencies = [ "fastapi>=0.115, <0.140", "uvicorn>=0.30, <1.0" ]
requires-python = "~=3.12.0"

[dependency-groups]
dev = ["coverage>=7.10,<8.0", "httpx>=0.27,<1.0", "ruff>=0.12,<1.0"]

[tool.coverage.run]
source = ["app"]
omit = ["app/pages.py"]

[tool.coverage.report]
fail_under = 55
skip_covered = true

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools]
packages = ["app", "api"]

[tool.vercel]
entrypoint = "api.index:app"
